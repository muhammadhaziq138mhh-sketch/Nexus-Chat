[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA Fallback: Redirect all routes to index.html with 200 HTTP status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Media Permissions Headers (Microphone, Camera for WebRTC & Voice Notes)
[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "SAMEORIGIN"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"
      Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self)"
